<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaudhry Estate — WhatsApp Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
  body { background: #0b141a; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .phone { width: 400px; max-width: 100vw; height: 92vh; max-height: 800px; background: #0b141a;
           border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
           box-shadow: 0 0 40px rgba(0,0,0,.6); }
  .header { background: #075E54; color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: #25D366; color: #fff;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
  .who .name { font-weight: 600; font-size: 16px; }
  .who .status { font-size: 12px; color: #d1f4cc; }
  .demo-tag { margin-left: auto; font-size: 10px; background: rgba(255,255,255,.2);
              padding: 3px 8px; border-radius: 10px; }
  .chat { flex: 1; overflow-y: auto; padding: 16px 12px; background: #0b141a;
          background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
          background-size: 22px 22px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 10px; font-size: 14.5px; line-height: 1.45;
         white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: #1f2c34; color: #e9edef; align-self: flex-start; border-top-left-radius: 2px; }
  .user { background: #005c4b; color: #e9edef; align-self: flex-end; border-top-right-radius: 2px; }
  .typing { font-style: italic; color: #8696a0; font-size: 13px; align-self: flex-start; }
  .inputbar { background: #1f2c34; padding: 8px 10px; display: flex; gap: 8px; align-items: center; }
  .inputbar input { flex: 1; border: none; outline: none; background: #2a3942; color: #e9edef;
                    border-radius: 20px; padding: 10px 16px; font-size: 14.5px; }
  .inputbar button { border: none; background: #25D366; color: #fff; width: 44px; height: 44px;
                    border-radius: 50%; font-size: 18px; cursor: pointer; }
  .hint { background: #1f2c34; color: #8696a0; font-size: 11.5px; padding: 6px 12px; text-align: center; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="avatar">C</div>
    <div class="who">
      <div class="name">Chaudhry Estate</div>
      <div class="status">online — auto-reply bot</div>
    </div>
    <div class="demo-tag">DEMO</div>
  </div>
  <div class="hint">Ye demo hai — asli WhatsApp se connected nahi. Neeche message likho aur bot ko test karo.</div>
  <div class="chat" id="chat"></div>
  <div class="inputbar">
    <input id="inp" type="text" placeholder="Message likho..." autocomplete="off">
    <button id="send" title="Bhejo">➤</button>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
const sessionId = 'demo-' + Math.random().toString(36).slice(2);

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

// v3: timeout HATA diya — browser ab jawab ka jitna marzi wait karega.
// (Test ke liye: taake pata chale reply 60s ke baad aata bhi hai ya nahi.)
async function send() {
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  addMsg(text, 'user');
  const tp = document.createElement('div');
  tp.className = 'typing';
  tp.textContent = 'typing...';
  chat.appendChild(tp);
  chat.scrollTop = chat.scrollHeight;
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, sessionId })
    });
    const data = await r.json();
    tp.remove();
    addMsg(data.reply || data.error || 'kuch garbar hui', 'bot');
  } catch (e) {
    tp.remove();
    addMsg('Server se connect nahi ho saka.', 'bot');
  }
}

document.getElementById('send').onclick = send;
inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// Pehla greeting
addMsg('Assalam o Alaikum! Chaudhry Estate mein khush aamdeed. 🏠\nDHA / Bahria Lahore mein ghar ya plot chahiye? Apna budget aur area batayein, main behtareen options nikalta hun.', 'bot');
</script>
</body>
</html>
